<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern UI Dashboard Component</title>
    <style>
        /* Modern UI Styling & Design Tokens */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.5);
            --success-color: #10b981;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Glassmorphism Card Container */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 0 0 30px var(--accent-glow);
        }

        /* Header Layout */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .badge {
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent-color);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-color);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--success-color);
        }

        /* Typography */
        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.925rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        /* Interactive Counter Section */
        .counter-section {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .counter-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .counter-value {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-primary);
            transition: var(--transition);
        }

        .counter-value.pulse {
            transform: scale(1.1);
            color: var(--accent-color);
        }

        /* Modern CTA Button */
        .btn {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn:hover {
            background: #4f46e5;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Semantic UI Component -->
    <article class="card">
        <header class="card-header">
            <span class="badge">Analytics Dashboard</span>
            <div class="status-dot" title="System Active"></div>
        </header>
        
        <main>
            <h2>Interactive Metrics</h2>
            <p>A lightweight micro-frontend module highlighting sleek styling paradigms, optimal accessibility targets, and modern dark mode visuals.</p>
            
            <section class="counter-section">
                <span class="counter-label">Total Interactions</span>
                <span id="counter" class="counter-value">0</span>
            </section>
        </main>

        <footer>
            <button id="actionBtn" class="btn">Trigger Interaction</button>
        </footer>
    </article>

    <!-- UI State JavaScript Controller -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const button = document.getElementById('actionBtn');
            const counterEl = document.getElementById('counter');
            let count = 0;

            button.addEventListener('click', () => {
                count++;
                
                // Update text content safely
                counterEl.textContent = count;
                
                // Add micro-interaction animation class
                counterEl.classList.add('pulse');
                
                // Remove the class after the transition finishes to allow re-triggering
                setTimeout(() => {
                    counterEl.classList.remove('pulse');
                }, 150);
            });
        });
    </script>
</body>
</html>
